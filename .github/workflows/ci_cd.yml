# Nom du workflow (affiché dans l'onglet "Actions")
name: CI/CD Pipeline

# Déclencheurs : push et pull request sur main
on:
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]
  workflow_dispatch:

jobs:
  # JOB 1 : Tests
  test:
    runs-on: ubuntu-latest
    steps:
      # 1. Récupère le code du dépôt sur le runner
      - name: Récupérer le code
        uses: actions/checkout@v4

      # 2. Installe Python 3.12 avec cache pip
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # 3. Installe les dépendances
      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # 4. Lance les tests (échec = job rouge)
      - name: Lancer les tests
        run: pytest -q

      # 5. Vérifie le style du code avec flake8
      - name: Vérifier le style avec flake8
        run: |
          pip install flake8
          flake8 app.py --max-line-length=88

  # JOB 2 : Build Docker (uniquement si "test" réussit)
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      # Le tag utilise le SHA du commit
      - name: Construire l'image Docker
        run: docker build -t myapp:${{ github.sha }} .

      - name: Confirmer le build
        run: echo "Image construite avec le tag myapp:${GITHUB_SHA}"
